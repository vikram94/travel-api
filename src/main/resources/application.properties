spring.application.name=travel-api

# --- Database: file-backed H2 in PostgreSQL compatibility mode (single process).
# Uniqueness of external_id and the invoice snapshot live in DB constraints, not in memory.
spring.datasource.url=jdbc:h2:file:./data/travel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=10

# --- Invoice tuning (documented in README) ---
# 1000 is a per-request guardrail, not a claim that invoices cannot be larger in a future design.
invoice.max-transactions=1000
invoice.load-chunk-size=500
invoice.items-page-default=100
invoice.items-page-max=500

# Write transactions time out after ~10s. Lock waits fail faster via H2 LOCK_TIMEOUT=5000
# and are mapped to 503 busy (Retry-After: 1), never 500.
spring.transaction.default-timeout=10s

# JSON: money decimals stay exact (no double); API is snake_case.
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.property-naming-strategy=SNAKE_CASE
